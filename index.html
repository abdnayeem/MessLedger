<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover">
<meta name="theme-color" content="#2E5DE8" id="theme-color-meta">
<script>
  // THEME INIT — runs synchronously, before any CSS or the boot loader
  // paints, so the correct theme is on <html> from the very first frame
  // (no light-flash before a dark switch kicks in, and vice versa).
  // Preference source, in order: explicit user choice saved in
  // localStorage, else the OS-level prefers-color-scheme, else light.
  (function () {
    try {
      var saved = localStorage.getItem('messledger-theme');
      var theme = saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MessLedger">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>MessLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</noscript>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Inline critical CSS so a loading state shows immediately, before the
     external stylesheets above have even finished downloading. Without
     this, the page is a truly blank white screen until fonts.googleapis.com,
     cdnjs (Font Awesome), and css/style.css all finish loading — which is
     exactly the "5 seconds of white screen" being seen. */
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  html,body{background:#F6F7F4; margin:0; width:100%; overflow-x:hidden;}
  /* Dark-theme critical override — kept minimal (just the boot screen's
     own hard-coded colors), since data-theme is already on <html> by the
     time this runs (see the THEME INIT script above), avoiding a light
     flash before css/style.css finishes loading. */
  html[data-theme="dark"],html[data-theme="dark"] body{background:#000000;}
  html[data-theme="dark"] #boot-loader{background:#000000;}
  html[data-theme="dark"] .skel-block{background:#1C1C1E;}

  /* ===== MessLedger boot / loading screen =====
     One signature texture (a fine dot grid) instead of several stacked
     effects — restrained on purpose so it reads as premium SaaS chrome,
     not decoration competing with the logo. */
  #boot-loader{
    position:fixed; inset:0; overflow:hidden; z-index:99999;
    display:flex; align-items:center; justify-content:center;
    background:#FAFBFA;
    font-family:sans-serif;
  }

  /* fine dot grid — fixed size, centered explicitly (not full-viewport),
     so it stays a tidy halo behind the mark instead of stretching into a
     huge, oddly-shaped haze on wide desktop screens. */
  #boot-loader .bl-dots{
    position:absolute; width:620px; height:620px; left:50%; top:44%; transform:translate(-50%,-50%);
    pointer-events:none;
    background-image:radial-gradient(rgba(46,93,232,.4) 1px, transparent 1px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, #000 0%, transparent 78%);
    mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, #000 0%, transparent 78%);
    opacity:.5;
  }

  /* one quiet radial wash behind the mark — same fixed-size + explicit
     centering fix as .bl-dots above (it previously had no top/left, so on
     a flex container it fell back to the top-left corner instead of
     actually centering — invisible on a small phone screen, obvious on a
     big desktop one). */
  #boot-loader .bl-glow{
    position:absolute; width:420px; height:420px; left:50%; top:44%; transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(46,93,232,.09), transparent 68%);
    pointer-events:none; animation:bl-glow-breathe 6s ease-in-out infinite;
  }

  /* center card */
  #boot-loader .bl-content{
    position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:16px;
    animation:bl-fade-in .5s ease-out;
  }
  #boot-loader .bl-ring-wrap{position:relative; width:80px; height:80px; display:flex; align-items:center; justify-content:center;}
  #boot-loader .bl-ring-track{position:absolute; inset:0; border-radius:50%; border:2.5px solid rgba(46,93,232,.10);}
  #boot-loader .bl-ring{position:absolute; inset:0; border-radius:50%; border:2.5px solid transparent; border-top-color:#2E5DE8; animation:boot-spin 1s linear infinite;}
  #boot-loader .bl-logo{
    width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -6px rgba(46,93,232,.4);
    border-radius:14px;
  }
  #boot-loader .bl-logo img{width:100%; height:100%; display:block; border-radius:14px;}
  #boot-loader .bl-brand{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:.1px;
    color:#1E2A44; margin-top:6px;
  }
  #boot-loader .bl-txt{color:#8A93A3; font-size:12px; letter-spacing:.1px; text-align:center; transition:opacity .15s ease;}

  @keyframes boot-spin{to{transform:rotate(360deg);}}
  @keyframes bl-fade-in{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @keyframes bl-glow-breathe{0%,100%{opacity:.7; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);}}

  /* ===== Skeleton / shimmer placeholders =====
     Shown UNDER the brand mark on #boot-loader. The .bl-show-skeleton
     class is added by armBootSkeleton() (06-auth.js) ~350ms after the
     loader appears — never immediately — so a fast connection never even
     flashes it; only a load that's actually taking a moment shows shaped,
     shimmering placeholders instead of a blank gap under the spinner. */
  .skel-block{
    position:relative; overflow:hidden; border-radius:10px;
    background:#ECEEF3;
  }
  .skel-block::after{
    content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    animation:skel-shimmer 1.5s ease-in-out infinite;
  }
  @keyframes skel-shimmer{100%{transform:translateX(100%);}}

  #boot-loader .bl-skeleton{
    width:min(320px, 82vw); margin-top:26px;
    display:flex; flex-direction:column; gap:10px;
    opacity:0; transition:opacity .25s ease;
  }
  #boot-loader.bl-show-skeleton .bl-skeleton{opacity:1;}
  #boot-loader .bl-skel-card{height:64px; border-radius:14px;}
  #boot-loader .bl-skel-row{height:15px; width:100%;}
  #boot-loader .bl-skel-row.short{width:62%;}

  @media (prefers-reduced-motion:reduce){
    #boot-loader *{animation-duration:.001ms !important; animation-iteration-count:1 !important;}
    .skel-block::after{animation:none; display:none;}
  }  /* Custom "Install app" banner (replaces relying on the browser's own
     install-menu entry) — purely presentational, no app data/logic
     involved. See the script near the end of <body> for the show/hide
     behavior (beforeinstallprompt on Android/Chrome, manual instructions
     on iOS Safari where a programmatic install prompt doesn't exist). */
  .pwa-install-banner{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h,56px) + var(--safe-b,0px) + 10px);z-index:250;display:none;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#5B4FE0,#2E5DE8);color:#fff;box-shadow:0 10px 30px -8px rgba(46,93,232,.45);opacity:0;transform:translateY(16px);transition:opacity .25s ease,transform .25s ease;max-width:480px;margin:0 auto;font-family:Inter,sans-serif}
  .pwa-install-banner.pib-show{display:flex}
  .pwa-install-banner.pib-show.pib-in{opacity:1;transform:translateY(0)}
  .pib-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
  .pib-icon img{width:26px;height:26px}
  .pib-text{flex:1;min-width:0}
  .pib-title{font-weight:700;font-size:13.5px}
  .pib-sub{font-size:11.5px;opacity:.9;margin-top:2px;line-height:1.3}
  .pib-actions{display:flex;gap:8px;flex-shrink:0}
  .pib-install-btn,.pib-later-btn{border:none;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;padding:8px 14px;-webkit-tap-highlight-color:transparent}
  .pib-install-btn{background:#fff;color:#33607F}
  .pib-later-btn{background:rgba(255,255,255,.18);color:#fff;font-weight:600;padding:8px 12px}
  @media (max-width:380px){.pib-sub{display:none}}
</style>
</head>
<body>
<div id="boot-loader">
  <div class="bl-dots"></div>
  <div class="bl-glow"></div>
  <div class="bl-content">
    <div class="bl-ring-wrap"><div class="bl-ring-track"></div><div class="bl-ring"></div><div class="bl-logo"><img src="favicon.png" alt="" width="100" height="100"></div></div>
    <div class="bl-brand">MessLedger</div>
    <div class="bl-txt">Loading MessLedger…</div>
    <!-- Skeleton preview of the dashboard about to load — fades in only if
         the fetch is slow enough to actually be seen (see .bl-skeleton
         transition-delay above), so the blank/spinner-only gap on a slow
         connection now shows shaped, shimmering placeholders instead. -->
    <div class="bl-skeleton">
      <div class="skel-block bl-skel-card"></div>
      <div class="skel-block bl-skel-row"></div>
      <div class="skel-block bl-skel-row short"></div>
      <div class="skel-block bl-skel-row"></div>
    </div>
  </div>
</div>
<!-- Custom install banner — hidden by default; shown by the script near the
     end of <body> only when the browser reports the app is actually
     installable (or, on iOS, always offered manually since iOS has no
     installability signal to check). -->
<div id="pwa-install-banner" class="pwa-install-banner" role="dialog" aria-label="Install MessLedger">
  <div class="pib-icon"><img src="favicon.png" alt=""></div>
  <div class="pib-text">
    <div class="pib-title">Install MessLedger</div>
    <div class="pib-sub">Add it to your home screen for faster access.</div>
  </div>
  <div class="pib-actions">
    <button type="button" class="pib-install-btn" id="pib-install-btn">Install</button>
    <button type="button" class="pib-later-btn" id="pib-later-btn">Later</button>
  </div>
</div>
<div id="app">
  <div id="toast-container" class="toast-container"></div>
  <div id="login-screen"></div>
  <div id="main-screen">
    <div class="layout">
      <!-- Sidebar card: logo/branding + nav menu grouped in one container (desktop only —
           on mobile this collapses via display:contents and the bottom tab bar is unchanged). -->
      <aside class="sidebar-card" id="sidebar-card">
        <div class="sidebar-brand">
          <div class="logo-dot"><img src="favicon.png" alt="" width="20" height="20" style="width:20px; height:20px; flex-shrink:0; display:block; border-radius:5px;"></div>
          <div class="brand-text">
            <h1>MessLedger</h1>
            <div class="sub">Meal &amp; expense tracker</div>
          </div>
        </div>
        <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      </aside>

      <div class="main-col">
        <!-- Page header card: notification/balance/profile row + viewing-month
             row, grouped into one card that lines up with the content cards
             below it instead of floating separately above the sidebar. -->
        <div class="page-header-card">
          <header class="topbar">
            <div class="brand">
              <div class="logo-dot"><img src="favicon.png" alt="" width="20" height="20" style="width:20px; height:20px; flex-shrink:0; display:block; border-radius:5px;"></div>
              <div class="brand-text">
                <h1>MessLedger</h1>
                <div class="sub">Meal &amp; expense tracker</div>
              </div>
            </div>
            <div class="header-greeting" id="header-greeting"></div>
            <div class="who" id="who-box"></div>
          </header>
          <div class="month-bar">
            <label for="month-select"><i class="fas fa-calendar-week"></i> Viewing month</label>
            <input type="month" id="month-select">
          </div>
        </div>

        <main class="content-wrap">
          <div id="content"></div>
        </main>
      </div>
    </div>
    <div class="bottom-nav-spacer" aria-hidden="true"></div>

    <!-- Mobile bottom tab bar: up to 4 quick-access tabs + a "More" tab that
         opens the sheet below. Rendered by renderTabs() in 07-ui-shell.js.
         Desktop keeps using the .tabs sidebar list above — this is mobile-only. -->
    <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Sections"></nav>

    <div class="more-sheet-backdrop" id="more-sheet-backdrop" onclick="closeMoreSheet()"></div>
    <div class="more-sheet" id="more-sheet" role="dialog" aria-modal="true" aria-label="More sections">
      <div class="more-sheet-handle" aria-hidden="true"></div>
      <div class="more-sheet-head">
        <h2>More</h2>
        <button type="button" class="more-sheet-close" onclick="closeMoreSheet()" aria-label="Close"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="more-sheet-body" id="more-sheet-body"></div>
    </div>
  </div>
</div>

<!-- Firebase SDKs (compat build — plain <script> tags, no bundler needed) -->
<script defer src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<!-- App files, in order: config → storage adapter → app logic. defer preserves this order. -->
<script defer src="js/firebase-config.js"></script>
<script defer src="js/storage.js"></script>
<!-- Perf: js/app/00..20 (21 files) are bundled into this ONE file to cut
     ~21 separate script requests down to 1 -- same code, same order, same
     global scope as before (see js/app/bundle.js header comment). Edit the
     individual numbered files in js/app/ as usual; just regenerate
     bundle.js after. -->
<script defer src="js/app/bundle.js"></script>
<script defer src="js/responsive-tables.js"></script>
<script>
  // Register the service worker (app shell caching + installability).
  // Runs after full load so it never competes with the app's own boot
  // work for bandwidth/CPU on first paint.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  // Visible online/offline indicator, so it's obvious which mode the app
  // is currently running in. Reuses the app's own toast system
  // (showToast, defined in js/app/bundle.js) when it's ready; falls back
  // to a console log for the rare case a toast fires before bundle.js has
  // finished loading (e.g. an "offline" event firing during initial boot).
  (function () {
    function announceConnectivity(isOnline) {
      var msg = isOnline ? 'Back online' : 'You’re offline — showing saved data';
      if (typeof showToast === 'function') {
        showToast(msg, isOnline ? 'success' : 'error');
      } else {
        console.log('[MessLedger]', msg);
      }
    }
    window.addEventListener('online', function () { announceConnectivity(true); });
    window.addEventListener('offline', function () { announceConnectivity(false); });
    // If the page itself was loaded while offline, say so once boot finishes.
    if (!navigator.onLine) {
      window.addEventListener('load', function () {
        setTimeout(function () { announceConnectivity(false); }, 600);
      });
    }
  })();
</script>
<script>
  // Custom "Install app" banner. Fully self-contained — doesn't touch
  // bundle.js, Firestore, or any app data. Two paths:
  //   - Android/Chrome/Edge: the browser fires 'beforeinstallprompt' when
  //     it decides the page is installable; we intercept that (so the
  //     browser's own mini-infobar never shows) and show our own banner
  //     instead. Tapping "Install" replays the browser's real native
  //     prompt() — this can't be faked or skipped, it's the same
  //     permission dialog the browser would show either way, just
  //     triggered from our button instead of a menu.
  //   - iOS Safari: there is no 'beforeinstallprompt' event at all — iOS
  //     never tells a page it's installable, and there's no API to trigger
  //     the install programmatically. So on iOS this banner just shows
  //     manual instructions instead ("Share -> Add to Home Screen") when
  //     tapped, since that's the only way to install there.
  (function () {
    var STORAGE_KEY = 'pwaInstallBannerDismissedAt';
    var DISMISS_DAYS = 7; // don't nag again for a week after "Later"
    var banner = document.getElementById('pwa-install-banner');
    var installBtn = document.getElementById('pib-install-btn');
    var laterBtn = document.getElementById('pib-later-btn');
    if (!banner || !installBtn || !laterBtn) return;

    function isStandalone() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
             window.navigator.standalone === true; // legacy iOS flag
    }
    function recentlyDismissed() {
      try {
        var t = localStorage.getItem(STORAGE_KEY);
        return !!t && (Date.now() - parseInt(t, 10)) < DISMISS_DAYS * 24 * 60 * 60 * 1000;
      } catch (e) { return false; }
    }
    function dismiss() {
      banner.classList.remove('pib-in');
      setTimeout(function () { banner.classList.remove('pib-show'); }, 250);
      try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (e) {}
    }
    function showBanner() {
      if (isStandalone() || recentlyDismissed()) return;
      banner.classList.add('pib-show');
      // Two nested rAFs so the browser actually paints the display:flex
      // state first — without this the opacity/transform transition below
      // has nothing to transition FROM and just snaps in instantly.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { banner.classList.add('pib-in'); });
      });
    }

    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      showBanner();
    });
    // Already installed (via our banner OR the browser's own menu) —
    // make sure the banner isn't left showing in either case.
    window.addEventListener('appinstalled', dismiss);

    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (isIOS && !isStandalone() && !recentlyDismissed()) {
      setTimeout(showBanner, 2000); // small delay so it doesn't fight the boot loader for attention
    }

    laterBtn.addEventListener('click', dismiss);
    installBtn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          dismiss();
        });
      } else if (isIOS) {
        var msg = 'Tap the Share icon, then "Add to Home Screen"';
        if (typeof showToast === 'function') showToast(msg, 'success');
        else alert(msg);
        dismiss();
      } else {
        dismiss();
      }
    });
  })();
</script>
</body>
</html>
